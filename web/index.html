<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Nexus Chat - Real-time AI Chat, Homework/Assignment Solver & Messenger">
  <meta name="theme-color" content="#0D0D12">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nexus Chat">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Nexus Chat</title>
  <link rel="manifest" href="manifest.json">

  <script>
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      window.deferredPrompt = e;
      console.log('Nexus Chat: beforeinstallprompt captured!');
    });

    window.triggerPwaInstall = async function() {
      if (window.deferredPrompt) {
        window.deferredPrompt.prompt();
        const choice = await window.deferredPrompt.userChoice;
        console.log('Nexus Chat install outcome:', choice.outcome);
        window.deferredPrompt = null;
        return choice.outcome === 'accepted';
      }
      return false;
    };

    window.hasInstallPrompt = function() {
      return !!window.deferredPrompt;
    };
  </script>
</head>
<body style="background-color: #0D0D12; margin: 0; padding: 0;">
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
