name: personal_ai_chat
description: "A real-time personal AI chat application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  google_sign_in: ^6.3.0
  
  # AI Integration
  google_generative_ai: ^0.2.2
  
  # UI & Styling
  google_fonts: ^6.1.0
  intl: ^0.19.0
  firebase_storage: ^13.6.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.3
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
